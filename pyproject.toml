[project]
name = "log-c2-018"
version = "0.1.1"
description = "LogisticsKPINarrativeSummaryAgent — AgentCore Template"
requires-python = ">=3.11"
# The framework (agenticstar-agentcore) is not a public-PyPI dependency; CI
# installs it from the package registry. Pinning it here would make
# `pip install -e .` fail because it is not resolvable from the default index.
dependencies = [
    "agenticstar-agentcore[marketplace,openai]==1.0.3",]

[project.optional-dependencies]
dev = [
    "pytest==8.1.1",
    "pytest-cov==5.0.0",
    "pytest-asyncio==0.23.6",
    "ruff==0.4.4",
    "mypy==1.10.0",
    "types-PyYAML==6.0.12.20240311",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
exclude = ["tests*", "docs*"]

[build-system]
requires = ["setuptools==68.2.2"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
# The published framework wheel ships no py.typed marker, so framework.* and
# shared.* imports resolve to Any — which turns every required framework
# subclass into an untyped-import / subclass-of-Any error. Every other strict
# setting stays on.
disallow_subclassing_any = false

[[tool.mypy.overrides]]
module = ["framework.*", "shared.*"]
ignore_missing_imports = true

# State extends the framework's AgentState TypedDict. That is correct at
# runtime, but the untyped wheel makes AgentState resolve to Any, so mypy cannot
# see the TypedDict base and mis-flags every field. Silence only that
# diagnostic, and only for this module: the errors all have the one cause.
[[tool.mypy.overrides]]
module = ["src.schemas.state"]
# Two diagnostics, one cause. `total=False` is rejected because the resolved base
# is Any and so carries object's __init_subclass__ signature, not TypedDict's.
disable_error_code = ["valid-type", "call-arg"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
